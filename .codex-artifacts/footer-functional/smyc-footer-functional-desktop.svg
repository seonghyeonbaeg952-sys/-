  <g id="Footer/Desktop/Functional">
    <rect width="1536" height="520" fill="#17191d"/>
    <rect width="1536" height="4" fill="#f04b23"/>

    <g id="Header/Utility">
      <use href="#smyc-symbol" x="72" y="30" width="42" height="47" fill="#f04b23"/>
      <text x="130" y="51" class="serif ivory" font-size="18" font-weight="700">서울모테트청소년합창단</text>
      <text x="130" y="71" class="sans orange" font-size="10" font-weight="700" letter-spacing="1.5">SEOUL MOTET YOUTH CHOIR</text>

      <g id="Utility/Phone">
        <text x="1080" y="45" class="sans label orange">PHONE</text>
        <text x="1080" y="67" class="sans small ivory">02-579-7295</text>
      </g>

      <g id="Action/Join" role="button">
        <rect x="1216" y="28" width="116" height="48" rx="24" fill="#f04b23"/>
        <text x="1274" y="58" class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#17191d">입단 안내 ↗</text>
      </g>
      <g id="Action/Support" role="button">
        <rect x="1344" y="28" width="120" height="48" rx="24" fill="none" stroke="#56575a"/>
        <text x="1404" y="58" class="sans ivory" font-size="14" font-weight="700" text-anchor="middle">후원·문의 ↗</text>
      </g>
    </g>

    <line x1="72" y1="112" x2="1464" y2="112" stroke="#34363a"/>

    <g id="Information/Contact">
      <text x="72" y="153" class="sans label orange">합창단 안내</text>
      <text x="72" y="188" class="serif ivory" font-size="22" font-weight="700">필요한 정보를 빠르게 찾으세요.</text>
      <text x="72" y="222" class="sans muted" font-size="13">서울모테트음악재단 청소년아카데미 부설 합창단입니다.</text>
      <text x="72" y="244" class="sans muted" font-size="13">합창 교육과 공연 활동으로 청소년의 음악적 성장을 돕습니다.</text>

      <text x="72" y="286" class="sans label orange">ADDRESS</text>
      <text x="148" y="286" class="sans small ivory">서울특별시 서초구 사임당로 8길 17 서주빌딩 B1</text>
      <text x="72" y="318" class="sans label orange">CONTACT</text>
      <text x="148" y="318" class="sans small ivory">02-579-7295</text>
    </g>

    <g id="Navigation/Explore">
      <text x="640" y="153" class="sans label orange">바로가기</text>
      <g id="Link/About"><text x="640" y="193" class="sans link ivory">합창단 소개</text><text x="814" y="193" class="sans muted" font-size="13">↗</text></g>
      <g id="Link/Spirit"><text x="640" y="235" class="sans link ivory">합창단 정신</text><text x="814" y="235" class="sans muted" font-size="13">↗</text></g>
      <g id="Link/Concerts"><text x="640" y="277" class="sans link ivory">공연·소식</text><text x="814" y="277" class="sans muted" font-size="13">↗</text></g>
      <g id="Link/Gallery"><text x="640" y="319" class="sans link ivory">갤러리</text><text x="814" y="319" class="sans muted" font-size="13">↗</text></g>
    </g>

    <g id="Navigation/Participate">
      <text x="890" y="153" class="sans label orange">참여</text>
      <g id="Link/Join"><text x="890" y="193" class="sans link ivory">입단 안내</text><text x="1064" y="193" class="sans muted" font-size="13">↗</text></g>
      <g id="Link/Support"><text x="890" y="235" class="sans link ivory">후원·문의</text><text x="1064" y="235" class="sans muted" font-size="13">↗</text></g>
      <g id="Link/Directions"><text x="890" y="277" class="sans link ivory">오시는 길</text><text x="1064" y="277" class="sans muted" font-size="13">↗</text></g>
    </g>

    <g id="Navigation/Connect">
      <text x="1140" y="153" class="sans label orange">연결</text>
      <g id="Link/Youtube"><text x="1140" y="193" class="sans link ivory">YouTube</text><text x="1346" y="193" class="sans muted" font-size="13">↗</text></g>
